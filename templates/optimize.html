{% extends "base.html" %}

{% block title %}Grimoire Prompt - 提示词优化{% endblock %}
{% block nav_optimize %}active{% endblock %}

{% block content %}
<div class="optimize-page">
    <!-- 配置栏 -->
    <div class="config-bar">
        <div class="form-group">
            <label for="template-select">优化模板</label>
            <select id="template-select">
                <option value="">加载中...</option>
            </select>
        </div>
        <div class="form-group">
            <label for="llm-select">LLM 配置</label>
            <select id="llm-select">
                <option value="">默认</option>
            </select>
        </div>
        <button id="optimize-btn" class="btn btn-primary">优化</button>
    </div>

    <!-- 分栏布局 -->
    <div class="split-layout">
        <!-- 输入区 -->
        <div class="input-section">
            <div class="section-header">
                <h3>输入提示词</h3>
                <span id="char-count">0 字</span>
            </div>
            <textarea id="prompt-input" placeholder="请输入需要优化的提示词..." rows="8"></textarea>
        </div>

        <!-- 输出区 -->
        <div class="output-section">
            <div class="section-header">
                <h3>优化结果</h3>
                <div class="output-actions">
                    <button id="copy-btn" class="btn btn-sm" disabled>复制</button>
                </div>
            </div>
            <!-- 意图覆盖率进度条 -->
            <div id="intent-coverage-bar" class="intent-coverage-bar" style="display:none;">
                <div class="coverage-progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div id="coverage-progress-fill" class="coverage-progress-fill"></div>
                </div>
                <div class="coverage-info">
                    <span id="coverage-percent" class="coverage-percent">0%</span>
                    <span id="coverage-status" class="coverage-status"></span>
                </div>
                <div id="coverage-tags" class="coverage-tags"></div>
            </div>
            <div id="output-area" class="output-content">
                <span class="placeholder">优化结果将在这里显示...</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/js/optimize.js?v=9"></script>
{% endblock %}
