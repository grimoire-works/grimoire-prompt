{% extends "base.html" %}

{% block title %}Grimoire Prompt - 模板管理{% endblock %}
{% block nav_templates %}active{% endblock %}

{% block content %}
<div class="manage-page">
    <div class="manage-layout">
        <!-- 左侧列表 -->
        <div class="manage-sidebar">
            <div class="sidebar-header">
                <h3>模板列表</h3>
                <button id="create-btn" class="btn btn-sm btn-primary">新建</button>
            </div>
            <ul id="template-list" class="item-list"></ul>
        </div>
        <!-- 右侧编辑 -->
        <div class="manage-detail" id="detail-panel">
            <div class="detail-placeholder">选择一个模板查看或编辑</div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/templates.js"></script>
{% endblock %}
